<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0B0A09" />
    <script>
      // First paint: stored preference, else light 07:00–19:00 local, dark otherwise.
      // Mirrors src/theme/types.ts so there is no flash before React mounts.
      (function () {
        var t = 'dark';
        try {
          var s = localStorage.getItem('catlantic.theme');
          if (s === 'light' || s === 'dark') t = s;
          else { var h = new Date().getHours(); t = h >= 7 && h < 19 ? 'light' : 'dark'; }
        } catch (e) {}
        var r = document.documentElement;
        r.setAttribute('data-theme', t);
        r.style.colorScheme = t;
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute('content', t === 'dark' ? '#0B0A09' : '#FAF9F5');
      })();
    </script>
    <title>Catlantic — Trade &amp; Logistics Partners</title>
    <meta
      name="description"
      content="Catlantic Trade and Logistics Partners LLC originates grain specialties, organics and minerals across South America for the United States, China, Asia and MENA — Kosher and Halal certified — and runs ocean freight and last-mile e-commerce logistics from Asia into Argentina, Brazil and Peru."
    />
    <meta property="og:title" content="Catlantic — Trade &amp; Logistics Partners" />
    <meta
      property="og:description"
      content="South American origination. Certified worldwide delivery."
    />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+SC:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
